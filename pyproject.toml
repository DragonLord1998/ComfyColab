[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "comfycolab"
version = "0.2.0.dev1"
description = "Install and run pinned ComfyUI on temporary Google Colab runtimes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "ComfyColab contributors" },
]
dependencies = [
  "google-colab-cli>=0.6,<0.7",
]

[project.optional-dependencies]
test = [
  "numpy>=1.26",
  "Pillow>=10",
]

[project.scripts]
comfycolab = "comfycolab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
