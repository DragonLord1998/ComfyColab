[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "comfycolab"
version = "0.1.0"
description = "Start ComfyUI on temporary Colab and load curated image-model bundles."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "ComfyColab contributors" },
]
dependencies = [
  "google-colab-cli>=0.6,<0.7",
]

[project.scripts]
comfycolab = "comfycolab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
